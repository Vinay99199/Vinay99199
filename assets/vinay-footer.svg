<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="vinayFooterTitle vinayFooterDesc">
  <title id="vinayFooterTitle">Vinay — Full Stack Developer</title>
  <desc id="vinayFooterDesc">A burgundy signature panel reading: Building ideas into digital experiences.</desc>
  <defs>
    <linearGradient id="vinayFooterBackground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="vinayFooterSweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="vinayFooterGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#E5B5C7" stroke-opacity="0.05"/>
    </pattern>
    <filter id="vinayFooterGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="vinayFooterClip"><rect width="1200" height="190" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#vinayFooterClip)">
    <rect width="1200" height="190" fill="url(#vinayFooterBackground)"/>
    <rect width="1200" height="190" fill="url(#vinayFooterGrid)"/>
    <path d="M782 213C876 78 975 45 1213 17M847 208C935 105 1037 65 1208 48" fill="none" stroke="#C77B9B" stroke-opacity="0.22"/>
    <path d="M96 139H1104" stroke="#701A3D" stroke-width="1"/>
    <path d="M96 139H1104" stroke="url(#vinayFooterSweep)" stroke-width="2" stroke-dasharray="160 848" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="1008;0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M96 139H1104" stroke="#E5B5C7" stroke-opacity="0.42" stroke-width="4" filter="url(#vinayFooterGlow)" stroke-dasharray="100 908" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="1008;0" dur="10s" repeatCount="indefinite"/>
    </path>
    <text x="96" y="78" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="5">VINAY</text>
    <text x="98" y="106" fill="#E5B5C7" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">FULL STACK DEVELOPER</text>
    <text x="1104" y="76" text-anchor="end" fill="#C77B9B" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="3">BUILDING IDEAS INTO</text>
    <text x="1104" y="101" text-anchor="end" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2">DIGITAL EXPERIENCES</text>
    <path d="M60 132L67 139L60 146L53 139Z" fill="#C77B9B"/>
    <path d="M1140 132L1147 139L1140 146L1133 139Z" fill="#E5B5C7"/>
    <rect x="1" y="1" width="1198" height="188" rx="17" fill="none" stroke="#C77B9B" stroke-opacity="0.32"/>
