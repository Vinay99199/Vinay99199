<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" role="img" aria-labelledby="contributionTitle contributionDesc">
  <title id="contributionTitle">Contributions in the last year</title>
  <desc id="contributionDesc">Animated burgundy section heading for Vinay's live GitHub contribution calendar.</desc>
  <defs>
    <linearGradient id="contributionBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10070C"/>
      <stop offset="0.56" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="contributionSweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="contributionGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="contributionClip"><rect width="1200" height="132" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#contributionClip)">
    <rect width="1200" height="132" fill="url(#contributionBg)"/>
    <rect width="1200" height="132" fill="url(#contributionGrid)"/>
    <path d="M66 32H101M66 32V67M1134 100H1169M1169 65V100" fill="none" stroke="#C77B9B" stroke-opacity="0.72"/>
    <text x="96" y="48" fill="#C77B9B" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="4">GITHUB ACTIVITY  /  LIVE</text>
    <text x="92" y="89" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="1">Contributions in the last year</text>
    <path d="M96 108H1104" stroke="#701A3D" stroke-width="2"/>
    <path d="M96 108H1104" stroke="url(#contributionSweep)" stroke-width="2.5" stroke-dasharray="145 863" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="1008;0" dur="8s" repeatCount="indefinite"/>
    </path>
    <rect x="1" y="1" width="1198" height="130" rx="15" fill="none" stroke="#C77B9B" stroke-opacity="0.32"/>
  </g>
</svg>
